<!-- basic skeleton -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base id="app-base" href="/" />
    <title>andrew yan</title>
    <link id="site-favicon" rel="icon" type="image/png" href="src/assets/favicon.png" sizes="any" />
    <script>
      (function () {
        var location = window.location;
        var host = String(location.hostname || "").toLowerCase();
        var isGithubProject = host.endsWith(".github.io");
        var segments = location.pathname.split("/").filter(Boolean);
        var first = segments[0] || "";
        var basePath = isGithubProject && first && first !== "404.html" && first !== "index.html" ? "/" + first : "";
        var iconHref = (basePath || "") + "/src/assets/favicon.png";
        var favicon = document.getElementById("site-favicon");

        if (favicon) favicon.setAttribute("href", iconHref);

        var shortcut = document.querySelector('link[rel="shortcut icon"]');
        if (!shortcut) {
          shortcut = document.createElement("link");
          shortcut.setAttribute("rel", "shortcut icon");
          shortcut.setAttribute("type", "image/png");
          document.head.appendChild(shortcut);
        }
        shortcut.setAttribute("href", iconHref);
      })();
    </script>
    <meta name="description" content="andrew yan films and scripts" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('js-ready');
    </script>
    <script>
      (function () {
        const location = window.location;
        const host = String(location.hostname || '').toLowerCase();
        const isGithubProject = host.endsWith('.github.io');
        const segments = location.pathname.split('/').filter(Boolean);
        const first = segments[0] || '';
        const basePath = isGithubProject && first && first !== '404.html' && first !== 'index.html' ? `/${first}` : '';
        const baseHref = `${basePath || ''}/`;
        const baseTag = document.getElementById('app-base');

        window.__APP_BASE_PATH__ = basePath;

        if (baseTag) {
          baseTag.setAttribute('href', baseHref);
        }

        if (location.search[1] !== '/') return;

        const decoded = location.search
          .slice(1)
          .split('&')
          .map((segment) => segment.replace(/~and~/g, '&'))
          .join('?');

        const normalizedBase = basePath ? `${basePath}/` : '/';
        const targetPath = `${normalizedBase.replace(/\/$/, '')}${decoded}`;
        const current = `${location.pathname}${location.search}${location.hash}`;
        const target = `${targetPath}${location.hash}`;

        if (current === target) return;
        window.history.replaceState(null, '', target);
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="load-overlay" class="intro-terminal" aria-hidden="true">
      <div class="intro-terminal-shell" aria-live="polite">
        <div class="intro-terminal-output" data-intro-output></div>
        <p class="intro-terminal-line intro-terminal-prompt" data-intro-prompt hidden><span class="intro-terminal-prompt-symbol" aria-hidden="true">&gt;</span><span class="intro-terminal-prompt-command">run /</span><span class="intro-caret" aria-hidden="true"></span></p>
      </div>
    </div>
    <div id="grain-layer" aria-hidden="true"></div>
    <div class="dream-stack" aria-hidden="true">
      <div class="ambient-base"></div>
      <div class="dream-haze layer-a"></div>
      <div class="dream-haze layer-b"></div>
      <div class="dream-haze layer-c"></div>
      <div class="fog-reveal"></div>
      <div class="dream-leak leak-a"></div>
      <div class="dream-leak leak-b"></div>
      <div class="dream-vignette"></div>
      <div class="dream-bloom"></div>
    </div>
    <div class="whisper-line" data-whisper aria-hidden="true"></div>
    <div class="film-gate" data-film-gate aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="./" data-link="/" data-anim-key="global:brand" data-reveal="link">andrew yan</a>
      <nav class="site-nav" aria-label="main navigation">
        <a href="./" data-link="/" data-anim-key="global:nav:home" data-reveal="link">home</a>
        <a href="./films" data-link="/films" data-anim-key="global:nav:films" data-reveal="link">films</a>
        <a href="./scripts" data-link="/scripts" data-anim-key="global:nav:scripts" data-reveal="link">scripts</a>
        <a href="./#about" data-about-link data-anim-key="global:nav:about" data-reveal="link">about</a>
      </nav>
    </header>

    <main id="app" class="route-fade"></main>

    <script defer src="./youtube-utils.js"></script>
    <script defer src="./src/films.js"></script>
    <script defer src="./src/scripts.js"></script>
    <script defer src="./src/pages/films.js"></script>
    <script defer src="./src/pages/film-detail.js"></script>
    <script defer src="./src/pages/scripts.js"></script>
    <script defer src="./src/pages/script-detail.js"></script>
    <script defer src="./script.js"></script>
  </body>
</html>
