<!-- fallback redirect pages -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base id="app-base" href="/" />
    <title>redirecting…</title>
    <link id="site-favicon" rel="icon" type="image/png" href="src/assets/favicon.png" sizes="any" />
    <script>
      (function () {
        var location = window.location;
        var host = String(location.hostname || "").toLowerCase();
        var isGithubProject = host.endsWith(".github.io");
        var segments = location.pathname.split("/").filter(Boolean);
        var first = segments[0] || "";
        var basePath = isGithubProject && first && first !== "404.html" && first !== "index.html" ? "/" + first : "";
        var baseHref = (basePath || "") + "/";
        var baseTag = document.getElementById("app-base");
        var iconHref = (basePath || "") + "/src/assets/favicon.png";
        var favicon = document.getElementById("site-favicon");

        if (baseTag) baseTag.setAttribute("href", baseHref);

        if (favicon) favicon.setAttribute("href", iconHref);

      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var location = window.location;
        var host = String(location.hostname || '').toLowerCase();
        var isGithubProject = host.endsWith('.github.io');
        var segments = location.pathname.split('/').filter(Boolean);
        var first = segments[0] || '';
        var basePath = isGithubProject && first && first !== '404.html' && first !== 'index.html' ? '/' + first : '';
        var requestPath = basePath ? '/' + segments.slice(1).join('/') : location.pathname;
        var cleanPath = requestPath === '/404.html' ? '/' : requestPath;
        var encodedPath = cleanPath.replace(/&/g, '~and~');
        var encodedSearch = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
        var targetPath = (basePath || '') + '/?/' + encodedPath.replace(/^\//, '') + encodedSearch + location.hash;

        if ((location.pathname + location.search + location.hash) === targetPath) return;
        location.replace(targetPath);
      })();
    </script>
  </head>
  <body>
    <div id="load-overlay" class="intro-terminal" aria-hidden="true">
      <div class="intro-terminal-shell" aria-live="polite">
        <div class="intro-terminal-output" data-intro-output></div>
        <p class="intro-terminal-line intro-terminal-prompt" data-intro-prompt hidden><span class="intro-terminal-prompt-symbol" aria-hidden="true">&gt;</span><span class="intro-terminal-prompt-command">run /</span><span class="intro-caret" aria-hidden="true"></span></p>
      </div>
    </div>
    <div id="grain-layer" aria-hidden="true"></div>
  </body>
</html>
